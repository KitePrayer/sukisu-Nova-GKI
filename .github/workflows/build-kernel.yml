# =====================================================================
# SukiSU Nova 自定义内核构建工作流
# ---------------------------------------------------------------------
# 在 GitHub Actions 上编译「你自己指定源码链接」的 Android 内核，
# 并集成 SukiSU Nova（官改版 KernelSU）。
#
# 用法：
#   1. fork 本仓库
#   2. Actions -> Build Kernel -> Run workflow
#   3. 填写源码链接、分支、defconfig、工具链等参数
#   4. 产物（boot.img / AnyKernel3.zip / Image）在 Artifacts 里下载
#
# 设计参考 moemoli/GKI_KernelSU_SUSFS 的 build.yml，但做了三点关键改造：
#   A. 内核源码 URL/分支/子目录/defconfig 全部由 workflow 输入参数指定
#      （支持 GKI 与非 GKI、官方与第三方源码）
#   B. 集成的是 SukiSU-Nova/SukiSU-Nova（新仓库，含 NyaZygisk），
#      而非旧仓库 SukiSU-Ultra
#   C. 绕开 Nova setup.sh 里 git.zako.shirkneko.top:20004 这个
#      非标准端口镜像源（Actions 网络拉不动），直接 clone GitHub 仓库
#      并手工做等价集成（软链 drivers/kernelsu + Makefile/Kconfig 条目）
# =====================================================================

name: Build Kernel (SukiSU Nova)

on:
  workflow_dispatch:
    inputs:
      # ---------------- 内核源码（自定义链接入口） ----------------
      kernel_source_url:
        description: "内核源码 git 地址 (如 https://github.com/xxx/android_kernel_xxx.git)"
        required: true
        type: string
      kernel_source_branch:
        description: "源码分支/tag/commit；留空 = 仓库默认分支（厂商仓库常只有 master，不要照抄 main）"
        required: false
        type: string
        default: ""
      kernel_source_dir:
        description: "内核源码在仓库中的子目录 (如 kernel/ 或 common/；根目录留空)"
        required: false
        type: string
        default: ""
      defconfig:
        description: "defconfig 名 (如 gki_defconfig / vendor_defconfig，不含路径)"
        required: true
        type: string
        default: "gki_defconfig"
      defconfig_path:
        description: "defconfig 所在目录 (默认 arch/arm64/configs，留空自动)"
        required: false
        type: string
        default: ""

      # ---------------- SukiSU Nova 配置 ----------------
      nova_source:
        description: "Nova 仓库 (默认官方 SukiSU-Nova/SukiSU-Nova；可改 fork)"
        required: false
        type: string
        default: "SukiSU-Nova/SukiSU-Nova"
      nova_branch:
        description: "Nova 分支: main(GKI/kprobe) 或 builtin(手动hook)"
        required: false
        type: string
        default: "main"
      nova_ref:
        description: "Nova 版本/tag/commit (留空 = 分支最新)"
        required: false
        type: string
        default: ""

      # ---------------- 内核选项 ----------------
      enable_kpm:
        description: "启用 KPM (CONFIG_KPM=y，需 64 位，可能影响稳定性)"
        required: false
        type: boolean
        default: false
      ksu_as_module:
        description: "CONFIG_KSU=m 编译成模块 (GKI LKM 用)；关=内置 y"
        required: false
        type: boolean
        default: false
      lto_mode:
        description: "LTO 模式。full=原厂配置但极易 OOM；thin=默认，省内存；none=关 LTO(同时关 CFI)"
        required: false
        type: choice
        options:
          - thin
          - none
          - full
        default: thin
      enable_btf:
        description: "保留 CONFIG_DEBUG_INFO_BTF (需要 pahole 版本匹配，失败会中断编译)"
        required: false
        type: boolean
        default: false
      extra_defconfig:
        description: "追加到 defconfig 的额外配置行 (每行一条，也支持 \\n 分隔)"
        required: false
        type: string
        default: ""

      # ---------------- 工具链 ----------------
      toolchain_clang:
        description: "Clang 版本号 (ZyCromerZ/Clang release tag，如 15.0.7-20260208-release；留空用默认)"
        required: false
        type: string
        default: ""
      use_gcc:
        description: "同时使用 GCC 交叉编译器 (老内核/厂商源码需要 CROSS_COMPILE)"
        required: false
        type: boolean
        default: false
      gcc_url:
        description: "GCC 交叉编译器 git 地址 (默认 LineageOS aarch64 6.4.1)"
        required: false
        type: string
        default: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-6.4.1.git"

      # ---------------- 产物 ----------------
      pack_anykernel:
        description: "打包 AnyKernel3 刷机包 (把 Image 塞进 TWRP 可刷的 zip)"
        required: false
        type: boolean
        default: true
      anykernel_repo:
        description: "AnyKernel3 模板仓库 (GKI 内核可用 WildKernels/AnyKernel3 的 gki-2.0 分支)"
        required: false
        type: string
        default: "https://github.com/osm0sis/AnyKernel3.git"
      release_tag:
        description: "发布到 GitHub Release 的 tag (留空=只传 Artifact)"
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出构建脚本
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget zip unzip lz4 xz-utils \
            build-essential libssl-dev libelf-dev bison flex dwarves \
            cpio bc kmod python3 python3-pip ccache
          # pahole (dwarves) 旧内核可能不需要，装了不碍事

      - name: 配置 ccache
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      # ---------- 1. 下载 SukiSU Nova ----------
      - name: 克隆 SukiSU Nova
        run: |
          set -e
          git clone --depth 1 \
            https://github.com/${{ inputs.nova_source }} \
            -b ${{ inputs.nova_branch }} \
            SukiSU-Nova
          if [ -n "${{ inputs.nova_ref }}" ]; then
            git -C SukiSU-Nova fetch --depth 1 origin ${{ inputs.nova_ref }}
            git -C SukiSU-Nova checkout ${{ inputs.nova_ref }}
          fi
          echo "NOVA_DIR=$GITHUB_WORKSPACE/SukiSU-Nova/kernel" >> $GITHUB_ENV

      # ---------- 2. 下载内核源码 ----------
      - name: 克隆内核源码
        env:
          SRC_URL: ${{ inputs.kernel_source_url }}
          SRC_REF: ${{ inputs.kernel_source_branch }}
        run: |
          set -e
          # 分支不存在时 git clone 会抛 exit 128，信息极少。先自己校验一遍，
          # 把「仓库到底有哪些分支」直接打出来。
          if [ -n "$SRC_REF" ]; then
            echo "[+] 校验 ref: $SRC_REF"
            if git ls-remote --exit-code --heads "$SRC_URL" "$SRC_REF" >/dev/null 2>&1; then
              echo "[+] 分支存在: $SRC_REF"
              CLONE_ARGS="--branch $SRC_REF"
            elif git ls-remote --exit-code --tags "$SRC_URL" "$SRC_REF" >/dev/null 2>&1; then
              echo "[+] tag 存在: $SRC_REF"
              CLONE_ARGS="--branch $SRC_REF"
            else
              # 可能是 commit SHA：浅克隆拿不到，只能全量再切
              if printf '%s' "$SRC_REF" | grep -qE '^[0-9a-f]{7,40}$'; then
                echo "[+] 按 commit SHA 处理: $SRC_REF"
                CLONE_ARGS=""
              else
                echo "::error::ref '$SRC_REF' 在该仓库中既不是分支也不是 tag"
                echo "----- 该仓库现有分支 -----"
                git ls-remote --heads "$SRC_URL" | sed 's#.*refs/heads/#  #' || true
                echo "----- 该仓库现有 tag -----"
                git ls-remote --tags "$SRC_URL" | sed 's#.*refs/tags/#  #' | head -20 || true
                echo "::error::把 kernel_source_branch 改成上面列出的值，或留空用默认分支"
                exit 1
              fi
            fi
          else
            echo "[+] 未指定分支，使用仓库默认分支"
            CLONE_ARGS=""
          fi

          # GKI common 单 commit 就几个 GB，--single-branch 能省一次全分支枚举
          git clone --depth 1 --single-branch $CLONE_ARGS "$SRC_URL" kernel-src
          if [ -z "$CLONE_ARGS" ]; then
            if [ -n "$SRC_REF" ]; then
              # 走到这里说明 SRC_REF 是个 commit SHA。服务器可能拒绝（不存在、
              # 或不是该分支上的 commit），直接抛 fatal 就回到原来那个谜之
              # 错误了，所以包一层，自己把话说清楚。
              if ! git -C kernel-src fetch --depth 1 origin "$SRC_REF" 2>/dev/null; then
                echo "::error::commit '$SRC_REF' 无法获取"
                echo "  可能原因："
                echo "   1. 该 commit 不存在于 $SRC_URL"
                echo "   2. 服务器设置了 uploadpack.allowReachableSHA1InWant=false，"
                echo "      浅克隆拿不到任意 commit（GitHub 就是这样）"
                echo "   3. SHA 写短了（只写前 7 位在浅克隆下基本必失败）"
                echo "----- 该仓库现有分支 -----"
                git ls-remote --heads "$SRC_URL" | sed 's#.*refs/heads/#  #' || true
                echo "::error::改用完整 SHA、或改填分支/tag，或留空用默认分支"
                exit 1
              fi
              if ! git -C kernel-src checkout --detach "$SRC_REF" 2>/dev/null; then
                echo "::error::已 fetch 到 $SRC_REF 但 checkout 失败"
                exit 1
              fi
            fi
          fi
          echo "[+] 检出版本: $(git -C kernel-src rev-parse --short HEAD 2>/dev/null || echo unknown)"

          KROOT="$GITHUB_WORKSPACE/kernel-src"
          if [ -n "${{ inputs.kernel_source_dir }}" ]; then
            KROOT="$KROOT/${{ inputs.kernel_source_dir }}"
            [ -f "$KROOT/Makefile" ] || { echo "::error::子目录 ${{ inputs.kernel_source_dir }} 下未找到 Makefile"; exit 1; }
          fi
          echo "KROOT=$KROOT" >> $GITHUB_ENV

      # ---------- 3. 集成 Nova 到内核源码 ----------
      - name: 集成 SukiSU Nova
        run: |
          bash scripts/ksu-integrate.sh
        env:
          KERNEL_DIR: ${{ env.KROOT }}
          NOVA_DIR: ${{ env.NOVA_DIR }}
          NOVA_BRANCH: ${{ inputs.nova_branch }}

      # ---------- 4. 定位 defconfig ----------
      - name: 定位 defconfig
        run: |
          # 具体校验/搜索在 scripts/build-kernel.sh 里做（支持 gki/ vendor/ 子目录
          # 和自定义 defconfig_path），这里只把名字传下去
          echo "DEFCONFIG=${{ inputs.defconfig }}" >> $GITHUB_ENV

      # ---------- 5. 工具链 ----------
      - name: 下载 Clang
        env:
          CLANG_OVERRIDE: ${{ inputs.toolchain_clang }}
          KROOT: ${{ env.KROOT }}
        run: |
          set -e
          # 优先用内核源码 build.config.constants 里声明的 CLANG_VERSION。
          # GKI 内核的 LTO / CFI / MODVERSIONS / BTF 对 clang 版本敏感，
          # 用错版本即使能编出来，KMI 也可能对不上，所以不自己拍版本号。
          WANT=""
          if [ -n "${CLANG_OVERRIDE}" ]; then
            WANT="$CLANG_OVERRIDE"
            echo "[+] 用户指定 clang: $WANT"
          elif [ -f "$KROOT/build.config.constants" ]; then
            WANT=$(grep -oE 'CLANG_VERSION=[A-Za-z0-9._-]+' "$KROOT/build.config.constants" \
                   | head -1 | cut -d= -f2)
            echo "[+] 从 build.config.constants 读到 CLANG_VERSION: ${WANT:-<空>}"
          fi

          # 统一成一个「解压后找得到 bin/clang」的方式
          probe_and_set() {
            # $1 = 解压根目录
            local root="$1"
            local c
            c=$(find "$root" -maxdepth 3 -type f -name clang -path '*/bin/*' 2>/dev/null | head -1)
            if [ -z "$c" ]; then
              echo "::error::解压后未找到 bin/clang，目录顶部："
              ls -la "$root" | head -20
              return 1
            fi
            local dir; dir="$(dirname "$c")"
            chmod -R +x "$dir" 2>/dev/null || true
            "$dir/clang" --version | head -1
            echo "CLANG_DIR=$(dirname "$dir")" >> $GITHUB_ENV
            echo "[+] CLANG_DIR=$(dirname "$dir")"
          }

          try_aosp() {
            local ver="$1"
            local url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${ver}.tar.gz"
            echo "[+] 尝试 AOSP prebuilts: $ver"
            # +archive 直出目录 tar（无 LFS 指针、无外层 wrapper 目录）
            if ! curl -fsSL --retry 2 --max-time 600 "$url" -o clang.tgz; then
              echo "[!] AOSP 下载失败"
              return 1
            fi
            rm -rf clang && mkdir -p clang
            if ! tar -xzf clang.tgz -C clang --strip-components=0 2>/dev/null; then
              echo "[!] AOSP 包解压失败"
              return 1
            fi
            probe_and_set clang
          }

          try_zyc() {
            local tag="$1"
            echo "[+] 回退 ZyCromerZ/Clang: $tag"
            local api="https://api.github.com/repos/ZyCromerZ/Clang/releases/tags/$tag"
            local url
            url=$(curl -sL --retry 3 --max-time 120 "$api" | python3 -c \
                  "import json,sys;d=json.load(sys.stdin);a=d.get('assets') or [];print(a[0]['browser_download_url'] if a else '')")
            if [ -z "$url" ]; then echo "[!] 解析不到下载地址"; return 1; fi
            echo "    下载: $url"
            if ! wget -q --timeout=600 "$url" -O clang.tgz; then echo "[!] 下载失败"; return 1; fi
            rm -rf clang && mkdir -p clang
            # 注意：这个包顶层是 README.md + aarch64-linux-gnu/，没有 wrapper 目录，
            # 所以不能 --strip-components，否则 bin/clang 会被剥错位。
            if ! tar -xzf clang.tgz -C clang 2>/dev/null; then echo "[!] 解压失败"; return 1; fi
            probe_and_set clang
          }

          ok=0
          if [ -n "$WANT" ]; then
            case "$WANT" in
              clang-*)  try_aosp "$WANT" && ok=1 || true ;;
              [0-9]*)   try_zyc  "$WANT" && ok=1 || true ;;
              *)        try_aosp "$WANT" && ok=1 || true ;;
            esac
          fi
          # 兜底：AOSP 取不到就退 ZyCromerZ 的稳定版
          if [ "$ok" -eq 0 ]; then
            echo "::warning::首选 clang 获取失败，回退 ZyCromerZ 15.0.7"
            try_zyc "15.0.7-20260208-release" && ok=1 || true
          fi
          if [ "$ok" -eq 0 ]; then
            echo "::error::所有 clang 来源都失败"
            exit 1
          fi

          # 版本是否与内核声明一致（只警告，不阻断）
          if [ -n "$WANT" ]; then
            echo "[+] 期望 clang: $WANT"
            echo "[+] 实际 clang: $("$(grep '^CLANG_DIR=' $GITHUB_ENV | tail -1 | cut -d= -f2-)"/bin/clang --version 2>/dev/null | head -1 || echo 未知)"
          fi
          rm -f clang.tgz

      - name: 下载 GCC 交叉编译器
        if: ${{ inputs.use_gcc }}
        run: |
          set -e
          rm -rf gcc
          git clone --depth 1 "${{ inputs.gcc_url }}" gcc
          # LineageOS 预编译包目录结构是 bin/ 直接在根下
          if [ -x gcc/bin/aarch64-linux-gnu-gcc ]; then
            echo "[+] GCC: $(gcc/bin/aarch64-linux-gnu-gcc --version | head -1)"
          else
            echo "::warning::未找到 gcc/bin/aarch64-linux-gnu-gcc，bin 目录："
            ls gcc/ | head
          fi
          echo "GCC_DIR=$GITHUB_WORKSPACE/gcc" >> $GITHUB_ENV

      # ---------- 6. 编译 ----------
      - name: 编译内核
        run: |
          bash scripts/build-kernel.sh
        env:
          KROOT: ${{ env.KROOT }}
          DEFCONFIG: ${{ env.DEFCONFIG }}
          DEFCONFIG_PATH: ${{ inputs.defconfig_path }}
          CLANG_DIR: ${{ env.CLANG_DIR }}
          USE_GCC: ${{ inputs.use_gcc }}
          GCC_DIR: ${{ env.GCC_DIR }}
          KSU_AS_MODULE: ${{ inputs.ksu_as_module }}
          ENABLE_KPM: ${{ inputs.enable_kpm }}
          LTO_MODE: ${{ inputs.lto_mode }}
          BTF_MODE: ${{ inputs.enable_btf == true && 'on' || 'off' }}
          EXTRA_DEFCONFIG: ${{ inputs.extra_defconfig }}
          PACK_ANYKERNEL: ${{ inputs.pack_anykernel }}
          ANYKERNEL_REPO: ${{ inputs.anykernel_repo }}

      # ---------- 7. 上传产物 ----------
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          compression-level: 9

      - name: 发布 Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: out/*
          generate_release_notes: true